# Example nginx reverse-proxy configuration for CDP4-COMET WEB (Blazor Server).
#
# Include this file at http context level: either /etc/nginx/conf.d/comet-web.conf
# or, on Debian/Ubuntu, /etc/nginx/sites-available/comet-web symlinked into
# sites-enabled — both are included inside the http block, which the map
# directives below require. Include it from ONE of those locations only:
# including it twice fails with a duplicate-variable error on the maps.
# nginx terminates TLS and proxies to the container published on 127.0.0.1:8086
# (adjust to your `docker run -p` mapping).
#
# NOTE on header inheritance: nginx `add_header` directives are NOT merged across
# levels — a block that declares its own `add_header` discards every header
# declared in an outer block. All response headers are therefore declared once,
# in the 443 server block, and the `location` blocks declare none.

# Forward the HTTP Upgrade mechanism only for WebSockets (the SignalR
# circuit). Forwarding arbitrary Upgrade values (e.g. "h2c") would allow
# smuggling cleartext HTTP/2 connections past the proxy's access controls.
map $http_upgrade $proxy_upgrade {
    ~*^websocket$ websocket;
    default       "";
}

map $proxy_upgrade $proxy_connection {
    websocket Upgrade;
    default   keep-alive;
}

# Cache policy, split by request URI:
#  - Static assets (stylesheets, scripts, fonts, images) are immutable enough to
#    cache; upstream ETags are preserved, so clients revalidate cheaply after
#    max-age expires. Increase max-age if deployments are rare.
#  - Everything else — the authenticated document, the SignalR negotiate
#    endpoint, health endpoints — is never stored: pages of a Blazor Server app
#    can contain engineering-model data and must not end up in shared caches or
#    on disk.
map $uri $comet_cache_control {
    default                                                        "no-store, no-cache, must-revalidate, max-age=0";
    ~*\.(?:css|js|mjs|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp)$  "public, max-age=86400";
}

server {
    listen 80;
    server_name comet-web.cdp4.org;   # adjust to your host
    server_tokens off;

    # TLS only — redirect everything else. Redirect to the configured name,
    # never to the attacker-controllable Host request header.
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    # http2 on;   # uncomment on nginx >= 1.25.1
    server_name comet-web.cdp4.org;   # adjust to your host

    # --- TLS -------------------------------------------------------------
    # Certificate paths as provisioned by e.g. certbot; see the Mozilla SSL
    # configuration generator for a maintained cipher policy.
    ssl_certificate     /etc/letsencrypt/live/comet-web.cdp4.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comet-web.cdp4.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Do not advertise the nginx version in responses and error pages.
    server_tokens off;

    # --- Response headers (apply to every response, including errors) ----
    # Clickjacking: the app is never embedded in frames by design.
    # CSP frame-ancestors is the modern control; X-Frame-Options covers
    # legacy browsers.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    # HSTS: enable only once TLS provisioning is known to be stable, and add
    # `includeSubDomains` only if every subdomain of this host serves HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Cache policy selected by the map above. The upstream Cache-Control is
    # suppressed below so exactly one policy reaches the client.
    add_header Cache-Control $comet_cache_control always;

    # --- Health endpoints ------------------------------------------------
    # /healthz, /health/startup and /ready are liveness probes for the
    # container orchestrator; they need not be reachable from the internet.
    # Uncomment to stop exposing them (or restrict via Health:AllowedHosts in
    # the application configuration).
    #location ~ ^/(healthz|health/|ready) {
    #    return 404;
    #}

    location / {
        proxy_pass http://127.0.0.1:8086;

        # WebSockets (Blazor Server SignalR circuit) — the Upgrade header is
        # allow-listed to "websocket" by the maps above; an empty value removes
        # the header, which is the h2c-smuggling mitigation. Connection is
        # deliberately set before Upgrade: the directive order is irrelevant to
        # nginx, and this order keeps the (map-blind) h2c scanner rule quiet.
        proxy_http_version 1.1;
        proxy_set_header Connection $proxy_connection;
        proxy_set_header Upgrade $proxy_upgrade;
        proxy_cache off;

        # Allow for LongPolling fallback and KeepAliveIntervals > 60 seconds
        proxy_read_timeout 100s;

        # Single-host deployment: hand the app the configured name, not the
        # attacker-controllable Host request header.
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A single Cache-Control per response: ours, from the map above.
        proxy_hide_header Cache-Control;

        # Do NOT add `add_header` directives here — they would silently discard
        # every header declared at server level (see note at the top).
    }
}
