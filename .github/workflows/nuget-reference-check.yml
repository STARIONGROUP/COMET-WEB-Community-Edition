name: "nuget package reference check"

on:
  # Branches are checked through pull_request; push only covers the long-lived branches, so a PR is not checked twice
  push:
    branches:
      - development
      - master
  pull_request:
  schedule:
    - cron: '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # We must fetch at least the immediate parents so that if this is
        # a pull request then we can checkout the head.
        fetch-depth: 2

    - name: Setup .NET Environment
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: add Starion GitHub nuget feed
      env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
      run: dotnet nuget add source https://nuget.pkg.github.com/STARIONGROUP/index.json -n StarionGithubFeed -u STARIONGROUP -p $PACKAGE_TOKEN --store-password-in-clear-text

    - name: add DevExpress nuget feed
      env:
          DEVEXPRESS_NUGET_KEY: ${{ secrets.DEVEXPRESS_NUGET_KEY }}
      run: dotnet nuget add source https://nuget.devexpress.com/api -n DXFeed -u DevExpress -p $DEVEXPRESS_NUGET_KEY --store-password-in-clear-text

    - name: Restore dependencies
      run: dotnet restore COMETwebapp.sln

    - name: Build
      run: dotnet build COMETwebapp.sln --no-restore /p:ContinuousIntegrationBuild=true

    - name: Checking NuGet vulnerabilites
      run: |
        # informational only — don't fail the job on tooling hiccups
        # (e.g. "Sequence contains no matching element" from --outdated)
        dotnet list COMETwebapp.sln package --outdated --include-transitive || true

        dotnet list COMETwebapp.sln package --deprecated --include-transitive || true

        set -e
        dotnet list COMETwebapp.sln package --vulnerable --include-transitive 2>&1 | tee vulnerabilities.log

        echo "Analyze dotnet list package command log output..."
        if grep -q -i "\bcritical\b\|\bhigh\b\|\bmoderate\b\|\blow\b" vulnerabilities.log; then
            echo "Security Vulnerabilities found"
            exit 1
        else
            echo "No Security Vulnerabilities found"
            exit 0
        fi