name: Semgrep OWASP Top Ten

on:
    # Branches are scanned through pull_request; push only covers the long-lived branches, so a PR is not scanned twice
    push:
      branches:
        - development
        - master
      tags-ignore:
        - '*'
    pull_request:
    schedule:
      - cron: '42 2 * * 3'

jobs:

  semgrep-full:
      runs-on: ubuntu-latest
      container:
        image: semgrep/semgrep

      steps:

        - name: clone application source code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            # We must fetch at least the immediate parents so that if this is
            # a pull request then we can checkout the head.
            fetch-depth: 2

        - name: full scan
          run: |
              semgrep scan --config "https://semgrep.dev/p/owasp-top-ten" --sarif --output=semgrep-sast.sarif --metrics=off

        - name: save report as pipeline artifact
          uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
          with:
            name: semgrep-sast.sarif
            path: semgrep-sast.sarif

        - name: publish code scanning alerts
          uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
          with:
            sarif_file: semgrep-sast.sarif
            category: semgrep