name: "CodeQL"

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'web-*'
  pull_request:
  schedule:
    - cron: '42 2 * * 3'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: add Github nuget feed
      env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
      run: dotnet nuget add source https://nuget.pkg.github.com/STARIONGROUP/index.json -n StarionGithubFeed -u STARIONGROUP -p $PACKAGE_TOKEN --store-password-in-clear-text

    - name: add DevExpress nuget feed
      env:
          DEVEXPRESS_NUGET_KEY: ${{ secrets.DEVEXPRESS_NUGET_KEY }}
      run: dotnet nuget add source https://nuget.devexpress.com/api -n DXFeed -u DevExpress -p $DEVEXPRESS_NUGET_KEY --store-password-in-clear-text

    - name: Install dependencies
      env:
        # Workaround for NU3012: the ReactiveUI/Splat NuGet signing certificate has been revoked.
        # Disable enforced package signature verification until the packages are updated. See issue for the long-term fix.
        DOTNET_NUGET_SIGNATURE_VERIFICATION: false
      run: dotnet restore COMETwebapp.sln

    - name: Build
      run: dotnet build COMETwebapp.sln --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3